<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mabel Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Mabel's portfolio. I like Scrabble, physics and teaching.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;700;800&family=Archivo+Black&family=Bangers&family=Michroma&display=swap">
<link rel="stylesheet" href="style.css">
<script>document.documentElement.classList.add("js");</script>
</head>
<body class="page-home">

<canvas id="field" aria-hidden="true"></canvas>
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <filter id="grit" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="ink" x="-10%" y="-30%" width="120%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.35" numOctaves="3" seed="11" result="streak"/>
    <feDisplacementMap in="SourceGraphic" in2="streak" scale="14" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<header class="wrap bar">
  <nav class="label" aria-label="Pages">
    <a href="work.html">Projects</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>
  <section class="wrap hero">
    <canvas class="rays" id="rays" aria-hidden="true"></canvas>
    <div class="tile-head" data-word="mabel" tabindex="0">
      <h1 class="rack" aria-label="Mabel">
        <span class="tile" aria-hidden="true">M<sub>3</sub></span><span class="tile" aria-hidden="true">A<sub>1</sub></span><span class="tile" aria-hidden="true">B<sub>3</sub></span><span class="tile" aria-hidden="true">E<sub>1</sub></span><span class="tile" aria-hidden="true">L<sub>1</sub></span>
      </h1>
    </div>
    <div class="intro">
      <p id="pitch" aria-live="polite">Hi, I'm Mabel. I like <em>Scrabble</em>, <em>physics</em> and <em>teaching</em>.</p>
    </div>
    <div class="stickers" id="stickers" aria-hidden="true"></div>
    <div class="sell">
      <label class="label" for="sell-level">No hard sell</label>
      <div class="sell-track">
        <input type="range" id="sell-level" min="0" max="4" step="0.001" value="0" aria-valuetext="No hard sell">
        <div class="sell-ticks" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      </div>
      <span class="label sell-max">Very hard sell</span>
      <output class="sell-now label" id="sell-name" for="sell-level">No hard sell</output>
    </div>
  </section>

  <section class="scene" aria-label="Things I like">
    <div class="scene-pin">
      <div class="scene-bg"></div>
      <div class="wrap">
        <span class="label">Things I like</span>
        <ul class="words">
          <li>Scrabble<small>QI = 11 pts</small></li>
          <li>Physics<small>F = ma</small></li>
          <li>Teaching<small>Ask me why</small></li>
        </ul>
      </div>
    </div>
  </section>

  <section class="wrap doors" aria-label="More">
    <a class="door" href="work.html"><span class="label">01</span><b>Projects</b><i aria-hidden="true">→</i></a>
    <a class="door red" href="contact.html"><span class="label">02</span><b>Contact</b><i aria-hidden="true">→</i></a>
  </section>
</main>

<div class="peek" aria-hidden="true"></div>
<script src="script.js"></script>
<script src="home.js"></script>
</body>
</html>
